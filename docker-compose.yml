# ============================================================
#  ALERVI — Docker Compose (Desarrollo Local)
# ============================================================
#  Uso:
#    cp .env.example .env        # (solo la primera vez)
#    docker compose up -d        # levantar todo
#    docker compose logs -f      # ver logs en tiempo real
#    docker compose down         # detener todo
#    docker compose down -v      # detener y borrar datos de BD
# ============================================================

services:

  # ---- Base de Datos (PostgreSQL + PostGIS) ----
  db:
    image: postgis/postgis:16-3.4
    container_name: alervi-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alervi_db}
      POSTGRES_USER: ${POSTGRES_USER:-alervi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alervi_dev_2026}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-alervi_user} -d ${POSTGRES_DB:-alervi_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# ---- Carga de datos ----
  datos-dev:
    build:
      context: packages/db
      dockerfile: ingest/Dockerfile
    container_name: alervi-datos-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alervi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alervi_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-alervi_db}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-alervi_app_db_2026}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ---- Backend API (FastAPI) ----
  backend:
    build:
      context: ./packages/backend-api
      dockerfile: Dockerfile
    container_name: alervi-backend
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-alervi_user}:${POSTGRES_PASSWORD:-alervi_dev_2026}@db:5432/${POSTGRES_DB:-alervi_db}"
      BACKEND_SECRET_KEY: ${BACKEND_SECRET_KEY:-dev-secret-key-cambiar-en-prod}
      BACKEND_DEBUG: ${BACKEND_DEBUG:-true}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./packages/backend-api/app:/code/app:ro
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
