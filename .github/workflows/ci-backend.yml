name: CI Backend

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'packages/backend-api/**'
      - 'packages/db/migrations/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'packages/backend-api/**'
      - 'packages/db/migrations/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  lint-and-test:
    name: Backend Lint + Test (RNF-P-4, RNF-M-1, RNF-M-2)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: alervi_test
          POSTGRES_USER: alervi_test
          POSTGRES_PASSWORD: alervi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alervi_test -d alervi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: ./packages/backend-api

    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest pytest-cov httpx

    - name: Linting con Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Tests con pytest
      env:
        BACKEND_SECRET_KEY: "test-secret"
        DATABASE_URL: "postgresql://alervi_test:alervi_test@localhost:5432/alervi_test"
        TEST_DATABASE_URL: "postgresql://alervi_test:alervi_test@localhost:5432/alervi_test"
        BACKEND_DEBUG: "true"
        ADMIN_MFA_DEFAULT_CODE: "482910"
        ADMIN_TOTP_SECRET: ""
        PHOTO_STORAGE_BACKEND: "local"
        PYTHONPATH: "."
      run: |
        python -m pytest -v --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80 tests/
