name: CI Backend

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'packages/backend-api/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'packages/backend-api/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  lint-and-test:
    name: Backend Lint + Test (RNF-P-4, RNF-M-1, RNF-M-2)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    defaults:
      run:
        working-directory: ./packages/backend-api

    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest pytest-cov httpx

    - name: Linting con Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Tests con pytest
      env:
        BACKEND_SECRET_KEY: "test-secret"
        DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        PYTHONPATH: "."
      run: |
        python -m pytest -v --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80 tests/
