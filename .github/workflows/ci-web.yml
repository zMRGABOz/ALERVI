name: CI Web

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'apps/web-municipal/**'
      - '.github/workflows/ci-web.yml'

jobs:
  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-municipal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: 'apps/web-municipal/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'apps/web-municipal/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter (ESLint) - RNF-M-2
        run: npm run lint

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Build Next.js - RNF-P-4
        run: npm run build
