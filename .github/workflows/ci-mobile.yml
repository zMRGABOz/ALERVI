name: CI Mobile

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "apps/mobile-ciudadano/**"
      - "packages/shared-contracts/**"
      - ".github/workflows/ci-mobile.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "apps/mobile-ciudadano/**"
      - "packages/shared-contracts/**"
      - ".github/workflows/ci-mobile.yml"

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile-ciudadano

jobs:
  # Build, pruebas JVM de ambos flavors, lint y umbral de cobertura (RNF-M-1/M-2).
  build:
    name: Build + unit + lint + cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Permisos de ejecución
        run: chmod +x gradlew

      # Mismos comandos que la validación local (README).
      - name: Ensamblar ambos flavors
        run: ./gradlew --no-daemon :app:assembleMockDebug :app:assembleLocalDebug

      - name: Pruebas unitarias y lint
        run: |
          ./gradlew --no-daemon \
            :app:testMockDebugUnitTest \
            :app:testLocalDebugUnitTest \
            :app:lintMockDebug

      - name: Cobertura ≥80 % líneas/ramas
        run: ./gradlew --no-daemon :app:verificarCobertura

      - name: Publicar informes JVM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-jvm
          path: |
            apps/mobile-ciudadano/app/build/reports/tests/
            apps/mobile-ciudadano/app/build/reports/jacoco/
            apps/mobile-ciudadano/app/build/reports/lint-results-mockDebug.*
          if-no-files-found: ignore

  # Pruebas instrumentadas/E2E en emulador API 34 (misma API que la validación local).
  instrumented:
    name: Instrumentadas API 34
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Permisos de ejecución
        run: chmod +x gradlew

      # KVM en runners ubuntu acelera el emulador; el job corre en paralelo al build.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pruebas instrumentadas (mock, API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
            -camera-back none -camera-front none
          # El action no hereda `defaults.run.working-directory`: hay que indicarlo.
          working-directory: apps/mobile-ciudadano
          script: ./gradlew --no-daemon :app:connectedMockDebugAndroidTest

      - name: Publicar informe instrumentado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-instrumentadas
          path: |
            apps/mobile-ciudadano/app/build/reports/androidTests/
            apps/mobile-ciudadano/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
