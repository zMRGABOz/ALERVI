name: Keep Alive Render

on:
  schedule:
    # Ejecuta cada 10 minutos (Render suspende tras 15 min de inactividad)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    name: Ping /health en Render
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verificar que RENDER_HEALTH_URL esté configurada
        if: ${{ vars.RENDER_HEALTH_URL == '' }}
        run: |
          echo "La variable de repositorio RENDER_HEALTH_URL no está configurada."
          echo "Configúrala en Settings -> Secrets and variables -> Actions -> Variables."
          exit 0

      - name: Llamar al endpoint /health
        if: ${{ vars.RENDER_HEALTH_URL != '' }}
        run: |
          curl --fail --silent --show-error --max-time 60 "${{ vars.RENDER_HEALTH_URL }}"
          echo ""
