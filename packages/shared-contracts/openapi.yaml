    # ------------------------------------------------------------------------
    # ALERTAS DE PROXIMIDAD (RETROCOMPATIBLE CON KOTLIN)
    # ------------------------------------------------------------------------
    AlertCheckRequest:
      type: object
      required:
        - session_id
        - latitude
        - longitude
        - speed_mps
        - timestamp
      properties:
        session_id:
          type: string
          format: uuid
          description: "Identificador único de la sesión de conducción iniciado en la app móvil (RB-14)."
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        latitude:
          type: number
          format: double
          minimum: -90.0
          maximum: 90.0
          example: -36.8285
        longitude:
          type: number
          format: double
          minimum: -180.0
          maximum: 180.0
          example: -73.0550
        speed_mps:
          type: number
          format: float
          minimum: 0.0
          description: "Velocidad instantánea en metros por segundo (1.38 m/s ≈ 5 km/h)."
          example: 13.88
        heading_degrees:
          type: number
          format: float
          minimum: 0.0
          maximum: 360.0
          nullable: true
          description: "Rumbo de desplazamiento del móvil en grados azimut (0 = Norte, 90 = Este)."
          example: 45.0
        accuracy_m:
          type: number
          format: float
          minimum: 0.0
          nullable: true
          description: "Precisión horizontal del GPS en metros (según FusedLocationProvider). RB-13 descarta > 30m."
          example: 8.5
        timestamp:
          type: string
          format: date-time
          description: "Marca de tiempo de la captura GPS (ISO 8601). RB-13 descarta datos de más de 5 s."
          example: "2026-11-03T02:30:00Z"

    AlertCheckResponse:
      type: object
      required:
        - alerta_activa
        - telemetria_status
      properties:
        alerta_activa:
          type: boolean
          description: "Verdadero si la app debe emitir la alerta sonora y visual en pantalla."
          example: true
        telemetria_status:
          type: string
          enum:
            - EVALUADO_CON_ALERTA
            - SUPRIMIDO_VELOCIDAD_BAJA
            - SUPRIMIDO_TRAYECTORIA_DIVERGENTE
            - SUPRIMIDO_TTC_MAYOR_12S
            - SUPRIMIDO_PUNTO_YA_ADVERTIDO
            - BAJA_PRECISION_GPS
            - TELEMETRIA_OBSOLETA
            - SIN_PUNTOS_EN_RANGO
          example: "EVALUADO_CON_ALERTA"
        alerta:
          $ref: '#/components/schemas/AlertDetail'

    AlertDetail:
      type: object
      nullable: true
      required:
        - id_punto
        - nombre_interseccion
        - nivel_riesgo
        - distancia_m
        - ttc_segundos
        - mensaje_visual
        - patron_sonoro
      properties:
        id_punto:
          type: integer
          example: 101
        nombre_interseccion:
          type: string
          example: "Av. Paicaví con Av. Los Carrera"
        nivel_riesgo:
          type: string
          enum: [CRITICO, ALTO, MEDIO]
          example: "ALTO"
        distancia_m:
          type: number
          format: float
          description: "Distancia en metros hacia el punto crítico."
          example: 112.5
        ttc_segundos:
          type: number
          format: float
          description: "Tiempo estimado de llegada (Time-To-Collision) en segundos (siempre <= 12 s)."
          example: 8.1
        mensaje_visual:
          type: string
          description: "Texto breve y legible a un golpe de vista según RNF-U-4 (sin exigir interacción táctil)."
          example: "⚠️ Zona de Riesgo a 110 m: Paicaví / Carrera"
        patron_sonoro:
          type: string
          enum: [BEEP_URGENTE, BEEP_PRECAUCION, TONO_CORTO]
          description: "Tipo de aviso sonoro que el servicio de audio de Android debe reproducir."
          example: "BEEP_PRECAUCION"
        instruccion_seguridad:
          type: string
          example: "Reduzca velocidad y preste atención al cruce"

    # ------------------------------------------------------------------------
    # AUDITORÍA (RNF-S-4)
    # ------------------------------------------------------------------------
    EventoAuditoriaResponse:
      type: object
      required:
        - id_evento
        - accion
        - fecha_hora
      properties:
        id_evento:
          type: integer
          example: 1042
        id_usuario:
          type: integer
          nullable: true
          example: 3
        correo_usuario:
          type: string
          nullable: true
          example: "inspector.vial@concepcion.cl"
        accion:
          type: string
          description: "Acción crítica ejecutada perteneciente a la lista cerrada (Tabla 5.1.2)."
          enum:
            - LOGIN_CORRECTO
            - LOGIN_FALLIDO
            - LOGOUT
            - CREAR_FICHA
            - EDITAR_FICHA
            - ELIMINAR_FICHA
            - SUBIR_FOTO
            - ELIMINAR_FOTO
            - CREAR_USUARIO
            - EDITAR_USUARIO
            - DESACTIVAR_USUARIO
            - CREAR_FACTOR
            - EDITAR_FACTOR
            - CALIBRAR_PONDERACIONES
            - INGESTA_CONASET
          example: "CREAR_FICHA"
        entidad_afectada:
          type: string
          nullable: true
          example: "FICHA_INSPECCION"
        id_afectado:
          type: string
          nullable: true
          example: "15"
        fecha_hora:
          type: string
          format: date-time
          example: "2026-11-02T16:30:00Z"
        detalles:
          type: string
          nullable: true
          example: "Creación de ficha técnica en punto 101 con 2 factores."

    AuditoriaListResponse:
      type: object
      required:
        - total
        - eventos
      properties:
        total:
          type: integer
          example: 320
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/EventoAuditoriaResponse'
