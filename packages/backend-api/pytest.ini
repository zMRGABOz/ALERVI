[pytest]
minversion = 7.0
testpaths = tests
pythonpath = .
addopts = 
    -v
    --strict-markers
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=80

filterwarnings =
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore::DeprecationWarning
    ignore::UserWarning

markers =
    unit: Pruebas unitarias de algoritmos, esquemas y lógica de negocio
    integration: Pruebas de integración con TestClient sobre endpoints y BD
    privacy: Pruebas específicas de privacidad GPS y cumplimiento RNF-S-8